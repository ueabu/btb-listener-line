# Deploy with: npm run deploy:fly  (passes the NEXT_PUBLIC_* build args from .env.local)
app = "btb-listener-line"
primary_region = "sjc"  # closest active region to Seattle; Fly retired "sea" for new machines

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1  # keep one machine always on, so there is no cold start

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
